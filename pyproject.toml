[project]
name = "hala"
version = "0.1.0"
description = "Audit, qualify and pitch local business websites."
requires-python = ">=3.10"
dependencies = ["anthropic>=1.0", "fastapi>=0.110", "uvicorn>=0.29", "psycopg[binary]>=3.1"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
hala = "hala.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hala"]

[tool.setuptools.package-data]
hala = ["static/**/*"]
